spring:
  application:
    name: cyber-security-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      # 应用统一以 UTC 读写时间：驱动按 UTC 转换 Instant，并把会话 time_zone 设为 UTC，
      # 使列默认值 CURRENT_TIMESTAMP 与 SQL 中的 UTC_TIMESTAMP 比较口径一致；不依赖 DB_URL 写法。
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  flyway:
    enabled: true
    baseline-on-migrate: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: UTC
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:18080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: never
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    rabbit:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
logging:
  level:
    root: INFO
  structured:
    format:
      console: ecs
cyber:
  security:
    login-throttle:
      hmac-key: ${LOGIN_THROTTLE_HMAC_KEY}
  ingest:
    outbox-relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      poll-ms: ${OUTBOX_RELAY_POLL_MS:1000}
    consumer:
      enabled: ${INGEST_CONSUMER_ENABLED:${OUTBOX_RELAY_ENABLED:false}}
      queue: ${INGEST_CONSUMER_QUEUE:q.ingest.batch.received}
      dead-letter-queue: ${INGEST_CONSUMER_DEAD_LETTER_QUEUE:q.ingest.dead}
      retry-queue-prefix: ${INGEST_CONSUMER_RETRY_QUEUE_PREFIX:q.ingest.batch.received.retry.}
      prefetch: ${INGEST_CONSUMER_PREFETCH:10}
    rabbitmq:
      host: ${RABBITMQ_HOST:127.0.0.1}
      port: ${RABBITMQ_PORT:5672}
      virtual-host: ${RABBITMQ_VHOST:/}
      username: ${RABBITMQ_USERNAME:}
      password: ${RABBITMQ_PASSWORD:}
      exchange: ${RABBITMQ_INGEST_EXCHANGE:cyber-security.ingest.events}
      dead-letter-exchange: ${RABBITMQ_DEAD_LETTER_EXCHANGE:cyber-security.dlx}
      confirm-timeout-ms: ${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}
