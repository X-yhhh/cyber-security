spring:
  config:
    # 仅在本机已完成登记时启用 TLS、真实消费与随服务采集；秘密仍留在受控运行目录。
    import: optional:file:${CYBER_LOCAL_SENSOR_CONFIG:${user.home}/Workspace/development/services/security/cyber-security/config/local-sensor.properties}
  session:
    jdbc:
      initialize-schema: never
cyber:
  security:
    local-admin-bootstrap:
      enabled: ${LOCAL_ADMIN_BOOTSTRAP_ENABLED:true}
